{%- comment -%}
  The bottom tab bar. A page marks its own tab in front matter:
    tab: /worlds/
  and that link gets class="is-current". No tab set, nothing is marked.
{%- endcomment -%}
<nav class="tabbar" aria-label="Primary">
  <a href="/"{% if page.tab == "/" %} class="is-current" aria-current="page"{% endif %}><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg><span>Home</span></a>
  <a href="/work/"{% if page.tab == "/work/" %} class="is-current" aria-current="page"{% endif %}><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5.5A1.5 1.5 0 0 1 9.5 4h5A1.5 1.5 0 0 1 16 5.5V7"/><path d="M3 12.5h18"/></svg><span>Work</span></a>
  <a href="/projects/"{% if page.tab == "/projects/" %} class="is-current" aria-current="page"{% endif %}><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>Projects</span></a>
  <a href="/education/"{% if page.tab == "/education/" %} class="is-current" aria-current="page"{% endif %}><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-4 9 4-9 4z"/><path d="M7 11v5c0 1 2.5 2 5 2s5-1 5-2v-5"/></svg><span>Education</span></a>
  <a href="/worlds/"{% if page.tab == "/worlds/" %} class="is-current" aria-current="page"{% endif %}><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5 14 9l6.5 2-6.5 2-2 6.5-2-6.5L3.5 11 10 9z"/></svg><span>Worlds</span></a>
</nav>
