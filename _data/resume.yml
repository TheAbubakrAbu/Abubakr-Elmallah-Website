# The résumé's Work Experience, the one copy on the site.
#
# Read by /resume/ (_includes/resume-work.html), which prints it word for
# word as it is on the PDF, and by /work/ (_includes/work-roles.html), which
# draws the same entries as a timeline. Edit the wording here, and only to
# match the PDF: the résumé page promises it is a transcription.
#
#   title, org, url, site, where, when, points   exactly as on the PDF
#   pdf     false for a role the PDF no longer lists: /work/ still shows it
#   span    the short date for the timeline's side column
#   now     still in the role: the timeline fills its node
#   stack   the one line of tags under the role on /work/
#
# highlights: the headline numbers the /work/ summary opens with. Each one is
# in a point below; change them together.

work:
  - title: 'Lead Software Developer'
    org: 'ICS Student Council (ICSSC)'
    url: 'https://studentcouncil.ics.uci.edu'
    site: 'studentcouncil.ics.uci.edu'
    where: 'Irvine, CA'
    when: 'February 2026 &#8211; Present'
    span: 'Feb 2026 &#8211; now'
    now: true
    stack: 'Next.js &#183; TypeScript &#183; AWS'
    points:
